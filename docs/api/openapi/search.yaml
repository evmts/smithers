paths:
  /api/repos/{owner}/{repo}/search/code:
    get:
      summary: GET /api/repos/{owner}/{repo}/search/code
      description: >-
        Searches code in one repository, with the repository's read permission.
      operationId: get_api_repos_owner_repo_search_code
      tags:
        - Search
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: The search text.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: A decimal offset into the results.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 100. Defaults to 30.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyJSON'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
