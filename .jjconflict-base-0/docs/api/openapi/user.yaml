  /api/user/github-app/installations:
    get:
      summary: GET /api/user/github-app/installations
      description: The caller's GitHub repositories the GitHub App verifiably covers, from the repository inventory (100 per page, at most 10 pages, most recently pushed first) and each repository's access diagnosis. An installation id filters the result; it never grants access. With no verified repository and a blocking verdict it answers 409 with that verdict's detail; an inventory over 900 repositories answers 503.
      operationId: get_api_user_github_app_installations
      tags:
        - User
      parameters: []
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Verified repositories.
          content:
            application/json:
              schema:
                type: object
                required: [repos, install_url]
                properties:
                  install_url:
                    type: string
                    description: Stored App installation URL, empty until configured.
                  repos:
                    type: array
                    items:
                      type: object
                      required: [fullName, pushedAt, installationId]
                      properties:
                        fullName:
                          type: string
                        pushedAt:
                          type: string
                        installationId:
                          type: integer
                          format: int64
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/user/github-app/installations/{installationId}:
    get:
      summary: GET /api/user/github-app/installations/{installationId}
      description: The caller's GitHub repositories the GitHub App verifiably covers, from the repository inventory (100 per page, at most 10 pages, most recently pushed first) and each repository's access diagnosis. An installation id filters the result; it never grants access. With no verified repository and a blocking verdict it answers 409 with that verdict's detail; an inventory over 900 repositories answers 503.
      operationId: get_api_user_github_app_installations_installation_id
      tags:
        - User
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Verified repositories.
          content:
            application/json:
              schema:
                type: object
                required: [repos, install_url]
                properties:
                  install_url:
                    type: string
                    description: Stored App installation URL, empty until configured.
                  repos:
                    type: array
                    items:
                      type: object
                      required: [fullName, pushedAt, installationId]
                      properties:
                        fullName:
                          type: string
                        pushedAt:
                          type: string
                        installationId:
                          type: integer
                          format: int64
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/user/github-repo-requests/{id}:
    get:
      x-composition: plue
      summary: Read a GitHub repository creation request
      description: What became of one of the caller's own GitHub repository creations. A completed request names the repository GitHub itself answered on the readback; an uncertain one names no repository, records the attempt and is never retried.
      operationId: get_api_user_github_repo_requests_id
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: The request's durable state
          content:
            application/json:
              schema:
                type: object
                required: [operation_id, state]
                properties:
                  operation_id: {type: string}
                  state: {type: string, enum: [accepted, dispatching, running, waiting, completed, failed, cancelled, uncertain]}
                  stage: {type: string, enum: [resolve-actor, create, readback]}
                  code:
                    type: string
                    enum: [repository_exists, reauthorize_github, github_permission, rate_limited, actor_changed, readback_mismatch, invalid_request, github_create_uncertain]
                  full_name: {type: string}
                  repository_id: {type: integer, format: int64}
                  external_attempt: {type: integer}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The repository creation store is not wired
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessError'}
  /api/user/github-pull-review-requests/{id}:
    get:
      summary: Read a GitHub pull request review request
      description: >-
        What became of one of the caller's own pull request reviews. A
        completed request names the review GitHub itself answered on the
        readback, bound to the submitted text, head and verdict under this
        credential's own GitHub user id. An uncertain one names no review,
        records the attempt and is never retried: the pull request may already
        carry the review, so it is re-read rather than submitted again. The
        answer survives a browser reload, because the operation lives in the
        durable store rather than in the page.
      operationId: get_api_user_github_pull_review_requests_id
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      x-required-token-scope: read:repository
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: The request's durable state
          headers:
            Cache-Control:
              description: Always `private, no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [operation_id, state, verified]
                properties:
                  operation_id: {type: string}
                  state: {type: string, enum: [accepted, dispatching, running, waiting, completed, failed, cancelled, uncertain]}
                  stage: {type: string, enum: [resolve-actor, fence, submit, readback]}
                  code:
                    type: string
                    enum: [reauthorize_github, github_permission, actor_changed, review_head_moved, pull_request_not_open, pull_request_mismatch, github_rejected_review, rate_limited, invalid_request, github_review_uncertain, readback_mismatch]
                  review_id: {type: integer, format: int64}
                  review_state: {type: string, enum: [APPROVED, CHANGES_REQUESTED, COMMENTED]}
                  commit_id: {type: string}
                  verified: {type: boolean}
                  external_attempt: {type: integer}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The review store is not wired
          content:
            application/json:
