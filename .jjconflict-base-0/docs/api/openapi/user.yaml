  /api/user/github-repos/{owner}/{repo}/pulls/{number}/reviews:
    post:
      summary: Submit one review to a GitHub pull request
      description: >-
        Requires write:repository and a user credential that is not
        repository-restricted; a session write also carries the browser CSRF
        token. Admits one durable review operation and answers without waiting
        on GitHub. The review is submitted ONCE, on the shared worker, with the
        signed-in person's own GitHub credential, so GitHub attributes it to
        that person. The request names no actor: the catalog command
        (github.account-review) is person-only and agent never, so an agent's
        review analysis can return findings but can never submit someone's
        verdict here. The idempotency key is derived from that actor and this
        intent (repository, number, verdict, text and reviewed head), so a
        repeated request joins the one operation instead of recording a second
        review. commit_id is the head commit the person reviewed; the worker
        refuses before any write if the pull request has moved to another head,
        is no longer open, or is not the named number. What became of the
        operation is read at /api/user/github-pull-review-requests/{id}: only a
        completed operation names a review, and it names one only because
        GitHub's own answer carried this intent's text, head and verdict under
        this credential's own GitHub user id. An ambiguous reply leaves the
        operation uncertain and is never blindly retried.
      operationId: create_api_user_github_repos_owner_repo_pulls_number_reviews
      tags:
        - User
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: number
          in: path
          required: true
          description: Pull request number, a positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
      x-required-token-scope: write:repository
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - commit_id
              properties:
                event:
                  type: string
                  description: The verdict. REQUEST_CHANGES and COMMENT require body text.
                  enum:
                    - APPROVE
                    - REQUEST_CHANGES
                    - COMMENT
                body:
                  type: string
                  maxLength: 65536
                commit_id:
                  type: string
                  description: The head commit the person reviewed, a 40-character SHA.
                  pattern: '^[0-9a-fA-F]{40}$'
      responses:
        '202':
          description: >-
            Durable admission; the review reaches GitHub only once the
            operation runs.
          headers:
            Cache-Control:
              description: Always `private, no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [operationId, requestId, kind, state, acceptedAt]
                properties:
                  operationId: {type: string}
                  requestId: {type: string}
                  kind: {type: string}
                  state: {type: string, enum: [accepted, dispatching, running, waiting, completed, failed, cancelled, uncertain]}
                  acceptedAt: {type: string, format: date-time}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The review store is not wired
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessError'}
