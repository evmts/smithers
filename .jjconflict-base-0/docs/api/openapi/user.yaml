        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: number
          in: path
          required: true
          description: Pull request number, a positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
        - name: per_page
          in: query
          required: false
          description: Rows per page, 1 to 100 (GitHub's own maximum, and the default here).
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: page
          in: query
          required: false
          description: Which page of rows to read, counting from 1. A validated page number on this fixed path is the only way a later page is requested; the upstream URLs in GitHub's Link header are never followed with the caller's credential.
          schema:
            type: integer
            minimum: 1
            maximum: 10000
      x-required-token-scope: read:repository
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
