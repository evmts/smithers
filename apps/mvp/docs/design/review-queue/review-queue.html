<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Review queue mock</title>
<style>
/* Decision 0022 mock. The app's Paper palette (packages/smithers/ui/ui-styleguide/src/themes/paper.ts)
   with the maintainer queue's layout (apps/maintainer-site/client/queue.css). */
:root {
  --bg: #f7f4ee; --side: #f2eee6; --surface: #fffefa; --surface2: #efeae0; --hover: #efeae0;
  --text: #211d18; --muted: #665f54; --faint: #8a8377;
  --border: rgba(33, 29, 24, 0.08); --border-strong: rgba(33, 29, 24, 0.16); --border-solid: #e4ddcf;
  --brand: #0f766e; --brand-soft: color-mix(in srgb, #0f766e 11%, #fffefa); --on-brand: #fffefa;
  --warning: #8c5a08; --warning-soft: color-mix(in srgb, #8c5a08 11%, #fffefa);
  --danger: #a4442a; --danger-soft: color-mix(in srgb, #a4442a 10%, #fffefa);
  --success: #0b5b57; --info: #3c6879;
  --mark: #f6e7b8; --code: #fbf9f4; --code-line: rgba(33, 29, 24, 0.035);
  --k-approval: #8c5a08; --k-changeset: #0f766e; --k-code: #7a4f9e; --k-decision: #3c6879;
  --k-recording: #a4442a; --k-design: #9a5b1e; --k-updates: #5d6b2f; --k-question: #2b7d8a; --k-failed: #a4442a;
  --t-c: #8a8377; --t-s: #2f7a3e; --t-k: #7a4f9e; --t-t: #3c6879; --t-f: #9a5b1e; --t-n: #a4442a;
  --shadow: 0 1px 2px rgb(33 29 24 / 0.05), 0 12px 32px rgb(33 29 24 / 0.10);
  --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --move: 160ms; --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1514; --side: #111a19; --surface: #131b1a; --surface2: #1a2422; --hover: #1a2422;
    --text: #ece7db; --muted: #a8a193; --faint: #857f73;
    --border: rgba(236, 231, 219, 0.09); --border-strong: rgba(236, 231, 219, 0.18); --border-solid: #293532;
    --brand: #45c4b2; --brand-soft: color-mix(in srgb, #45c4b2 14%, #131b1a); --on-brand: #0d1514;
    --warning: #f0c169; --warning-soft: color-mix(in srgb, #f0c169 13%, #131b1a);
    --danger: #d97757; --danger-soft: color-mix(in srgb, #d97757 13%, #131b1a);
    --success: #7fbfb3; --info: #82a8b8;
    --mark: #4a3f14; --code: #101917; --code-line: rgba(236, 231, 219, 0.04);
    --k-approval: #f0c169; --k-changeset: #45c4b2; --k-code: #c49be0; --k-decision: #82a8b8;
    --k-recording: #e58b72; --k-design: #e3a467; --k-updates: #a6c27c; --k-question: #6fcad8; --k-failed: #d97757;
    --t-c: #7f8a86; --t-s: #a6d27c; --t-k: #c49be0; --t-t: #82c4d8; --t-f: #e3a467; --t-n: #ee8b95;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 12px 32px rgb(0 0 0 / 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1514; --side: #111a19; --surface: #131b1a; --surface2: #1a2422; --hover: #1a2422;
  --text: #ece7db; --muted: #a8a193; --faint: #857f73;
  --border: rgba(236, 231, 219, 0.09); --border-strong: rgba(236, 231, 219, 0.18); --border-solid: #293532;
  --brand: #45c4b2; --brand-soft: color-mix(in srgb, #45c4b2 14%, #131b1a); --on-brand: #0d1514;
  --warning: #f0c169; --warning-soft: color-mix(in srgb, #f0c169 13%, #131b1a);
  --danger: #d97757; --danger-soft: color-mix(in srgb, #d97757 13%, #131b1a);
  --success: #7fbfb3; --info: #82a8b8;
  --mark: #4a3f14; --code: #101917; --code-line: rgba(236, 231, 219, 0.04);
  --k-approval: #f0c169; --k-changeset: #45c4b2; --k-code: #c49be0; --k-decision: #82a8b8;
  --k-recording: #e58b72; --k-design: #e3a467; --k-updates: #a6c27c; --k-question: #6fcad8; --k-failed: #d97757;
  --t-c: #7f8a86; --t-s: #a6d27c; --t-k: #c49be0; --t-t: #82c4d8; --t-f: #e3a467; --t-n: #ee8b95;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 12px 32px rgb(0 0 0 / 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
code { font: 0.88em var(--mono); background: var(--surface2); padding: 1px 4px; border-radius: 4px; }
kbd { display: inline-block; min-width: 1.6em; font: 600 11px/1 var(--mono); text-align: center; padding: 3px 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--surface); }

/* The chat shell: the host's header, the view, the chat button. */
.app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; height: 100vh; height: 100dvh; }
.host { display: flex; align-items: center; gap: 18px; padding: 10px 24px; font-size: 14px; }
.host .sp { flex: 1; }
.host a { color: var(--brand); text-decoration: none; }
.host .who { color: var(--text); }
.host .out { color: var(--muted); font-size: 13px; }
.nav-q { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.nav-q b { font-variant-numeric: tabular-nums; }
.bell { position: relative; width: 18px; height: 18px; display: inline-block; color: var(--muted); }
.bell svg { width: 18px; height: 18px; }
.bell i { position: absolute; top: -5px; right: -7px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--brand); color: var(--on-brand); font: 600 10px/15px var(--font); font-style: normal; text-align: center; }
.mode { border: 0; background: none; cursor: pointer; padding: 0; width: 18px; height: 18px; color: var(--text); }

.qbar { display: flex; align-items: center; gap: 16px; padding: 8px 24px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--surface); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 0; }
.qbar b { color: var(--text); font-weight: 600; }
.qbar .brand { font-weight: 650; color: var(--text); font-size: 14px; }
.kinds { display: flex; gap: 12px; overflow: hidden; }
.kind { display: inline-flex; align-items: center; gap: 4px; }
.kind::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--kc, var(--faint)); }
.qbar .sp { flex: 1; }
.cov { display: inline-flex; align-items: center; gap: 8px; }
.cov .bar { width: 64px; height: 5px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.cov .bar i { display: block; height: 100%; background: var(--brand); }
.k-approval { --kc: var(--k-approval); } .k-changeset { --kc: var(--k-changeset); } .k-code { --kc: var(--k-code); }
.k-decision { --kc: var(--k-decision); } .k-recording { --kc: var(--k-recording); } .k-design { --kc: var(--k-design); }
.k-updates { --kc: var(--k-updates); } .k-failed { --kc: var(--k-failed); } .k-question { --kc: var(--k-question); }

/* The stage: one item fills it. */
.stage { position: relative; min-height: 0; overflow: hidden; }
.card { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 760px); justify-content: center; transition: transform var(--move) var(--ease), opacity var(--move) var(--ease); }
.card.wide { grid-template-columns: minmax(360px, 430px) minmax(0, 1fr); justify-content: stretch; }
.card.wide.story { grid-template-columns: 212px minmax(360px, 420px) minmax(0, 1fr); }
.card.enter { transform: translateY(26px); opacity: 0; transition: none; }
.card.leave { transform: translateY(-26px); opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }

/* The storyline rail. */
.rail { border-right: 1px solid var(--border); padding: 20px 14px 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; background: var(--bg); }
.rail h2 { margin: 0 0 2px; font-size: 13px; font-weight: 650; }
.rail .pr { color: var(--faint); font: 12px var(--mono); margin-bottom: 10px; }
.step { display: grid; grid-template-columns: 14px 1fr; gap: 2px 8px; padding: 7px 8px; border-radius: 7px; color: var(--muted); }
.step.on { background: var(--brand-soft); color: var(--text); }
.step .n { grid-row: span 2; width: 14px; height: 14px; margin-top: 3px; border-radius: 50%; border: 1.5px solid var(--border-strong); }
.step.done .n { background: var(--brand); border-color: var(--brand); }
.step.on .n { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.step .t { font-weight: 600; color: inherit; }
.step .dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--kc); }
.dot.done { background: var(--kc); }
.dot.cur { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--kc); }
.rail .foot { margin-top: auto; padding-top: 12px; color: var(--faint); }

/* The item. */
.side { display: flex; flex-direction: column; gap: 13px; padding: 24px 26px 18px; overflow-y: auto; min-height: 0; }
.card:not(.wide) .side { padding-top: 5vh; }
.card.wide .side { border-right: 1px solid var(--border); background: var(--side); }
.meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--faint); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; color: var(--kc); text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--kc); }
.area { font-family: var(--mono); }
.prio { margin-left: auto; font-variant-numeric: tabular-nums; }
.title { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
.card:not(.wide) .title { font-size: 26px; }
.why { margin: -5px 0 0; color: var(--muted); font-size: 14px; }
.conf { display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font-size: 13.5px; }
.conf .pct { font: 700 18px/1 var(--font); color: var(--brand); font-variant-numeric: tabular-nums; }
.conf.mid .pct { color: var(--warning); }
.conf p { margin: 0; color: var(--muted); }
.conf p b { color: var(--text); font-weight: 600; }
.md { font-size: 14.5px; }
.md h3 { margin: 12px 0 3px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); font-weight: 650; }
.md h3:first-child { margin-top: 0; }
.md p { margin: 0 0 6px; }
.md ul { margin: 0 0 6px; padding-left: 18px; }
.md li { margin: 2px 0; }
.md pre { margin: 4px 0 8px; padding: 10px 12px; background: var(--code); border: 1px solid var(--border); border-radius: 8px; font: 11.5px/1.45 var(--mono); overflow-x: auto; color: var(--muted); }
.md pre b { color: var(--brand); font-weight: 600; }
.ref { color: var(--brand); text-decoration: none; cursor: pointer; }
.said { margin: 0; padding: 9px 13px; border-left: 3px solid var(--brand); background: var(--surface2); border-radius: 0 6px 6px 0; font-size: 14px; }
.said span { display: block; font-size: 12px; color: var(--faint); }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.links li { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); border-radius: 6px; padding: 3px 8px; font-size: 12.5px; color: var(--brand); background: var(--surface); }
.options { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.option { width: 100%; display: flex; align-items: flex-start; gap: 12px; text-align: left; padding: 11px 13px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--surface); cursor: pointer; }
.option:hover { background: var(--hover); }
.option.rec { border-color: color-mix(in srgb, var(--brand) 55%, transparent); }
.option.picked { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.option .ol { font-weight: 600; display: block; }
.option .od { color: var(--muted); font-size: 13.5px; display: block; }
.rec-tag { font-size: 11px; font-weight: 650; color: var(--brand); background: var(--brand-soft); padding: 1px 7px; border-radius: 10px; margin-left: 6px; vertical-align: 1px; font-variant-numeric: tabular-nums; }

/* The host's action strip: the note and the person's buttons. */
.strip { position: sticky; bottom: -18px; margin-top: auto; display: grid; gap: 9px; padding: 10px 0 18px; background: linear-gradient(to bottom, transparent, var(--side) 14px); }
.card:not(.wide) .strip { background: linear-gradient(to bottom, transparent, var(--bg) 14px); }
.scope { display: none; font-size: 12px; color: var(--brand); }
.scope-all .scope { display: block; }
.note { width: 100%; resize: vertical; min-height: 66px; font: 14px/1.5 var(--font); color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 9px; padding: 9px 12px; }
.note:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.note::placeholder { color: var(--faint); }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.act { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 550; }
.act:hover { background: var(--hover); }
.act.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.act.primary kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--on-brand) 45%, transparent); }
.act.deny { color: var(--danger); }
.hint { margin-left: auto; font-size: 12px; color: var(--faint); }
.host-label { font-size: 11px; color: var(--faint); letter-spacing: 0.02em; }

/* Later: the chooser replaces the buttons until a preset or Esc. */
.later { display: none; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 10px; padding: 10px; gap: 6px; box-shadow: var(--shadow); }
.choosing .later { display: grid; }
.choosing .acts { display: none; }
.later h4 { margin: 0 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); display: flex; justify-content: space-between; }
.later h4 span { text-transform: none; letter-spacing: 0; color: var(--warning); font-weight: 600; }
.preset { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 7px; border: 1px solid transparent; background: none; text-align: left; cursor: pointer; }
.preset:hover, .preset.sel { background: var(--hover); border-color: var(--border); }
.preset .at { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.preset.off { opacity: 0.45; cursor: default; }
.preset.off .at { color: var(--warning); }
.typed { display: flex; gap: 8px; align-items: center; padding: 4px 9px 2px; font-size: 13px; color: var(--faint); }
.typed input { flex: 1; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--bg); color: var(--text); font: 13px var(--font); padding: 5px 8px; }

/* The subject. */
.subject { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg); }
.tabs { display: flex; align-items: stretch; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--border); flex: none; overflow-x: auto; }
.tab { border: 1px solid transparent; border-bottom: none; background: none; padding: 6px 12px; border-radius: 7px 7px 0 0; font: 12.5px var(--mono); color: var(--muted); cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
.tab.on { background: var(--code); border-color: var(--border); color: var(--text); }
.tabs .tk { margin-left: auto; align-self: center; display: inline-flex; gap: 3px; padding-bottom: 6px; }
.fhead { display: flex; align-items: center; gap: 12px; padding: 7px 16px; font: 12px var(--mono); color: var(--muted); border-bottom: 1px solid var(--border); flex: none; min-width: 0; background: var(--code); }
.fhead .path { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fhead .rev { margin-left: auto; color: var(--faint); }
.fhead .tools { display: inline-flex; gap: 10px; color: var(--faint); }
.fhead .tools .on { color: var(--brand); }
.fnote { margin: 0; padding: 8px 16px; font-size: 13.5px; background: color-mix(in srgb, var(--mark) 55%, var(--bg)); border-bottom: 1px solid var(--border); flex: none; }
.codewrap { flex: 1; min-height: 0; display: flex; }
.code { flex: 1; overflow: auto; background: var(--code); font: 12.5px/1.6 var(--mono); padding: 6px 0 40px; }
.ln { display: flex; white-space: pre; }
.ln:hover { background: var(--code-line); }
.ln .no { flex: none; width: 52px; padding-right: 10px; text-align: right; color: var(--faint); user-select: none; cursor: pointer; }
.ln .fold { flex: none; width: 16px; color: var(--faint); cursor: pointer; text-align: center; user-select: none; }
.ln .lc { padding-right: 24px; }
.ln.mark { background: color-mix(in srgb, var(--brand) 9%, transparent); box-shadow: inset 3px 0 0 var(--brand); }
.ln.add { background: color-mix(in srgb, var(--success) 9%, transparent); }
.ln.add .no::after { content: " +"; color: var(--success); }
.code:focus, .map:focus, .evid:focus, .subject:focus, .side:focus { outline: none; }
.fhead .new { color: var(--success); font-weight: 600; }
.ln .chip { margin-left: 10px; font: 600 10.5px var(--font); color: var(--brand); background: var(--brand-soft); border-radius: 9px; padding: 0 7px; }
.ln.folded .lc::after { content: "⋯ " attr(data-hidden); color: var(--faint); background: var(--surface2); border-radius: 4px; padding: 0 5px; margin-left: 6px; font-size: 11px; }
.tc { color: var(--t-c); font-style: italic; } .ts { color: var(--t-s); } .tk { color: var(--t-k); } .tt { color: var(--t-t); } .tf { color: var(--t-f); } .tn { color: var(--t-n); }
.outline { width: 220px; flex: none; border-left: 1px solid var(--border); background: var(--side); padding: 12px; font-size: 13px; overflow-y: auto; display: none; }
.outline.open { display: block; }
.outline h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
.outline input { width: 100%; margin-bottom: 8px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text); padding: 4px 7px; font: 12px var(--font); }
.sym { display: flex; justify-content: space-between; gap: 8px; padding: 4px 6px; border-radius: 5px; font-family: var(--mono); font-size: 12px; cursor: pointer; }
.sym:hover, .sym.on { background: var(--hover); }
.sym span { color: var(--faint); }

/* Storyline map (the overview's subject). */
.map { flex: 1; overflow: auto; padding: 22px 26px 40px; display: grid; gap: 12px; align-content: start; }
.map .row { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
.map .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 650; font-size: 13px; background: var(--surface); border: 1px solid var(--border-strong); color: var(--muted); }
.map .row.done .num { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.scard { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 11px; padding: 12px 14px; }
.scard h4 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; gap: 10px; }
.scard h4 span { font: 12px var(--mono); color: var(--faint); font-weight: 400; }
.scard p { margin: 2px 0 9px; color: var(--muted); font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ichip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 7px; background: var(--bg); border: 1px solid var(--border); font-size: 12.5px; }
.ichip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--kc); }
.ichip.done { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--border-strong); }
.ichip b { color: var(--brand); font-weight: 650; }
.map .verdict .scard { border-style: dashed; }

/* Recording player. */
.player { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; margin: 16px 20px 0; border-radius: 10px; background: #0b1110; position: relative; overflow: hidden; display: grid; place-items: center; }
.scene { width: min(92%, 860px); aspect-ratio: 16 / 9; display: grid; grid-template-columns: 1.55fr 1fr; gap: 14px; }
.dev { background: #f7f4ee; border-radius: 8px; position: relative; overflow: hidden; color: #211d18; font-size: 10px; padding: 9px 11px; display: flex; flex-direction: column; gap: 6px; }
.dev.dark { background: #0d1514; color: #ece7db; }

  const kbd = (k) => `<kbd>${esc(k)}</kbd>`

  const KW = new Set("as async await break case catch class const continue default else export extends false for from function if import in let new null of return satisfies true try type typeof undefined while yield".split(" "))
  const RE = /(\/\/[^\n]*|\/\*\*?[^\n]*?\*\/)|("(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`)|(\b\d+\b)|([A-Za-z_$][\w$]*)/g
  const color = (line) => {
    let out = "", last = 0, m
    RE.lastIndex = 0
    while ((m = RE.exec(line))) {
      out += esc(line.slice(last, m.index))
      const cls = m[1] ? "tc" : m[2] ? "ts" : m[3] ? "tn" : KW.has(m[4]) ? "tk" : /^[A-Z]/.test(m[4]) ? "tt" : line[RE.lastIndex] === "(" ? "tf" : ""

  // ------------------------------------------------------------------------------------------------

  const REMIND = `// attention/remind: brings a snoozed entry back on every device when its time comes.
// Remote by need (DUR-5): it must fire while every device is off.
import { Effect, Schema } from "effect"
import { Flow, Sleep } from "@smthrs/flow"
import { Attention } from "../attention/Attention"

/** What a snooze asks for: whose row, which version, and when. */
export const RemindPayload = Schema.Struct({
  recipient: Schema.String,
  subject: Schema.String,
  version: Schema.Int,
  until: Schema.DateTimeUtc,
})

/** One execution per snooze, so a retried request admits nothing twice. */
export const remindId = (payload: typeof RemindPayload.Type) =>
  \`remind/\${payload.recipient}/\${payload.subject}/\${payload.version}\`

export default Flow.make("attention/remind", {
  description: "Bring a snoozed entry back when its time comes",
  capabilities: [],
  effects: ["db:write"],
  modelInvocable: false,
  payload: RemindPayload,
  success: Schema.Struct({ raised: Schema.Boolean }),
  body: (payload) =>
    Flow.sequence(
      // Parks durably; the Durable Object's alarm wakes it at \`until\`.
      Sleep.action.call({ until: payload.until }),
      Flow.step("raise", () =>
        Effect.gen(function* () {
          const attention = yield* Attention
          // A newer snooze, an answer or a dismissal makes this a no-op.
          const raised = yield* attention.raiseIfSnoozed({
            recipient: payload.recipient,
            subject: payload.subject,
            version: payload.version,
          })
          yield* Effect.annotateCurrentSpan("smithers.remind.raised", raised)
          return { raised }
        }),
      ),
    ),
})`
  const NOTIFICATIONS = `// Snooze: the person's own row, this version, until a time. Read as a pure function:
// a row is snoozed while snoozed_version = version and now < snoozed_until.
export const applySnooze = (who: Person, snooze: Snooze) =>
  Effect.gen(function* () {
    const sql = yield* SqlClient.SqlClient
    return yield* sql.withTransaction(
      Effect.gen(function* () {
        const rows = yield* sql\`
          UPDATE notifications
             SET snoozed_until = \${snooze.until},
                 snoozed_zone = \${snooze.zone},
                 snoozed_version = \${snooze.version},
                 updated_at = now()
           WHERE recipient = \${who.id}
             AND subject = \${snooze.subject}
             AND version = \${snooze.version}
             AND dismissed_version < version
          RETURNING version\`
        if (rows.length === 0) return { txid: null }
        // Same transaction: the timer exists exactly when the snooze does.
        yield* Executions.admit(Remind, {
          id: remindId({ recipient: who.id, ...snooze }),
          payload: { recipient: who.id, subject: snooze.subject, version: snooze.version, until: snooze.until },
        })
        return { txid: yield* currentTxid }
      }),
    )
  })`

import { DateTime } from "effect"

export const PRESETS = [
  { key: "1", label: "In 1 hour", at: (now: DateTime.Zoned) => DateTime.add(now, { hours: 1 }) },

] as const

/** A preset past the wait's deadline is shown disabled, with the deadline. */
export const offered = (now: DateTime.Zoned, deadline: DateTime.Utc | null) =>
  PRESETS.map((preset) => ({
    ...preset,
    open: deadline === null || DateTime.lessThan(preset.at(now), deadline),
  }))`

  function codeHtml(file) {
    const lines = file.text.split("\n")
    const hiddenBy = new Map()
    for (const [a, b] of file.folds) if (folded.has(`${file.tab}:${a}`)) for (let n = a + 1; n <= b; n++) if (!hiddenBy.has(n)) hiddenBy.set(n, a)
    const rows = []
    lines.forEach((text, i) => {
      const n = file.from + i
      if (hiddenBy.has(n)) return
      const comment = /^\s*(\/\/|\/\*\*)/.test(text)
      if (hideComments && comment) return
      const shown = hideComments ? text.replace(/\s+\/\/.*$/, "") : text
      const fold = file.folds.find(([a]) => a === n)
      const isFolded = fold && folded.has(`${file.tab}:${n}`)
      const mark = file.marks[n] !== undefined
      const add = file.addedLines?.includes(n)
      rows.push(`<div class="ln${mark ? " mark" : ""}${add ? " add" : ""}${isFolded ? " folded" : ""}" data-n="${n}"><a class="no">${n}</a><span class="fold" data-fold="${fold ? n : ""}">${fold ? (isFolded ? "▸" : "▾") : ""}</span><span class="lc"${isFolded ? ` data-hidden="${fold[1] - fold[0]} lines${(() => { const m = Object.keys(file.marks).filter((x) => x > fold[0] && x <= fold[1]).length; return m ? ` · ${m} to read` : "" })()}"` : ""}>${color(shown) || " "}${mark && file.marks[n] ? `<span class="chip">read ${file.marks[n]}</span>` : ""}</span></div>`)
    })
    return rows.join("")
  }

    header()
    footer()
    if (current().kind === "recording") { t = 0; paint() }
    history.replaceState(null, "", `${location.search}#${current().id}${chooserOpen() ? "-later" : ""}`)
  }
  const rerender = () => {
    const fresh = render(current())
    card.replaceWith(fresh)
    card = fresh
    footer()
    if (current().kind === "recording") paint()
  }
  const box = () => card?.querySelector(".note")
  const chooserOpen = () => Boolean(card?.classList.contains("choosing"))

  // ------------------------------------------------------------------------------------------------
  // The player.
  function paint() {
    const it = current()
    const f = Math.min(1, t / it.duration)
    const fill = $("tfill"), head = $("thead")
    if (!fill) return
    fill.style.width = `${f * 100}%`
    head.style.left = `${f * 100}%`
    $("clock").innerHTML = `<b>00:${String(Math.floor(t)).padStart(2, "0")}</b> / 00:${String(it.duration).padStart(2, "0")}`
    let ci = 0
    it.chapters.forEach(([s], i) => { if (s <= t + 0.001) ci = i })
    for (const s of card.querySelectorAll(".seg")) s.classList.toggle("on", Number(s.dataset.i) === ci)
    $("chap").textContent = it.chapters[ci][1]
    const scene = $("scene")
    scene.className = `scene s${ci}`
    const clock = ci >= 3 ? "01:12" : "00:12"
    $("clk-a").textContent = clock
    $("clk-b").textContent = clock
    $("ppl").textContent = playing ? "Pause" : "Play"
  }
  function loop(now) {
    if (!playing) return
    t += (now - last) / 1000
    last = now
    if (t >= current().duration) { t = current().duration; playing = false }
    paint()
    if (playing) raf = requestAnimationFrame(loop)
  }
  function toggle() { playing = !playing; last = performance.now(); if (playing) raf = requestAnimationFrame(loop); paint() }
  function stop() { playing = false; cancelAnimationFrame(raf) }
  function seek(s) { t = Math.max(0, Math.min(current().duration, s)); paint() }
  function chapter(step) {
    const ch = current().chapters
    let ci = 0
    ch.forEach(([s], i) => { if (s <= t + 0.001) ci = i })
    seek(ch[Math.max(0, Math.min(ch.length - 1, ci + step))][0])
  }

  // ------------------------------------------------------------------------------------------------
  // Answering: an empty note sends at once; the item slides away and the next one comes up.
  let toastTimer = 0
  function say(text) { const el = $("toast"); el.textContent = text; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 2000) }
  function answer(word) {
    const it = current()
    answered.add(it.id)
    if (word !== "Later") done++
    if (it.story && word === "Looks good") STORY.reviewed = Math.min(STORY.total, STORY.reviewed + 1)
    say(word)
    const list = visible()
    const next = list.find((x) => ITEMS.indexOf(x) > ITEMS.indexOf(it)) ?? list[0]
    if (next) show(ITEMS.indexOf(next))
    else { answered.clear(); show(0) }
  }
  function act(key) {
    const it = current()
    const a = it.acts.find(([k]) => k === key)
    if (key === "l") { card.classList.add("choosing"); history.replaceState(null, "", `${location.search}#${it.id}-later`); return }
    if (key === "r" && !box().value.trim()) { box().focus(); return }
    if (a) return answer(a[1])
    if (/^[1-4]$/.test(key) && it.options) return answer(it.options[Number(key) - 1].label)
  }
  function preset(k) {
    const p = card.querySelector(`[data-preset="${k}"]`)
    if (!p || p.disabled) return
    card.classList.remove("choosing")
    answer(`Later: ${p.querySelector("span").textContent}, ${p.querySelector(".at").textContent}`)
  }

  function sheet(kind) {
    const el = $("sheet")
    if (kind === "keys") {
      const rows = [["1–4", "Choose an option; in Later, a preset"], ["a", "Looks good, or Approve"], ["r", "Changes, or Deny (types in the note)"], ["l", "Later: 1 hour, this evening, tomorrow, next week"], ["u", "Undo the last answer"], ["g", "The note applies to every item of this kind here"], ["i  /", "Type in the note"], ["Esc", "Leave the note"], ["⌘ Enter", "Send with the note"], ["j k", "Scroll"], ["J K", "Next or previous file"], ["n p", "Next or previous media"], ["c", "Hide comments"], ["z Z", "Fold the body at the cursor, fold all"], ["O", "Outline"], ["b", "Before, after, both"], ["space", "Play or pause"], ["[ ]", "Previous or next chapter"], ["s", "The storyline"], ["d x o", "Dismiss, retry, open"], ["f", "Full screen or inline in the conversation"], ["?", "This sheet"]]
      el.innerHTML = `<div class="boxs" role="dialog" aria-label="Keys"><h2>Keys</h2><dl>${rows.map(([k, l]) => `<dt>${k.split(/\s+/).map(kbd).join(" ")}</dt><dd>${esc(l)}</dd>`).join("")}</dl></div>`
    } else {
      const cur = current()
      const entries = [["Overview", "storyline", "changeset", true]]
      STORY.steps.forEach((s, i) => { entries.push([`${i + 1} ${s.t}`, null]); s.items.forEach(([k, l, d, id]) => entries.push([l, id ?? null, k, d])) })
      entries.push(["Verdict", null], ["Merge #42", null, "approval", false])
      el.innerHTML = `<div class="boxs" role="dialog" aria-label="Storyline"><h2>#42 Later in the queue <span style="color:var(--faint);font-weight:400;font-size:13px">· ${STORY.reviewed} of ${STORY.total} reviewed</span></h2><div class="slist">${entries
        .map(([l, id, k, d]) => (k ? `<button class="${id === cur.id ? "on" : ""}" ${id ? `data-go="${id}"` : "disabled"}><span class="ichip k-${k}${d ? " done" : ""}">${esc(l)}</span><em>${d ? "reviewed" : id === cur.id ? "here" : id ? "" : "later"}</em></button>` : `<div class="sh">${esc(l)}</div>`))
        .join("")}</div><p style="color:var(--faint);font-size:12.5px;margin:12px 0 0">${kbd("j")} ${kbd("k")} move · ${kbd("Enter")} go · ${kbd("Esc")} close</p></div>`
    }
    el.hidden = false
  }

  // ------------------------------------------------------------------------------------------------
  // Keys and clicks. Every button has a key.
  document.addEventListener("keydown", (e) => {
    const typing = e.target instanceof HTMLTextAreaElement || e.target instanceof HTMLInputElement
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); const it = current(); return answer(box()?.value.trim() ? (it.acts.find(([k]) => k === "r")?.[1] ?? "Sent") : "Sent") }
    if (typing) { if (e.key === "Escape") e.target.blur(); return }
    if (e.metaKey || e.ctrlKey || e.altKey) return
    if (!$("sheet").hidden) { if (e.key === "Escape" || e.key === "?" || e.key === "s") $("sheet").hidden = true; return }
    const it = current()
    if (chooserOpen()) {
      if (/^[1-4]$/.test(e.key)) return preset(e.key)
      if (e.key === "l") return preset("3")
      if (e.key === "Escape") { card.classList.remove("choosing"); return }
      return
    }
    if (it.kind === "recording") {
      const pk = { " ": toggle, ArrowLeft: () => seek(t - 2), ArrowRight: () => seek(t + 2), "[": () => chapter(-1), "]": () => chapter(1), "0": () => seek(0) }[e.key]
      if (pk) { e.preventDefault(); return pk() }
    }
    const k = e.key
    const scroller = card.querySelector(".code, .map, .evid") ?? card.querySelector(".side")
    const handlers = {
      a: () => act("a"), r: () => act("r"), l: () => act("l"), x: () => act("x"), d: () => act("d"), o: () => (it.acts.some(([key]) => key === "o") ? act("o") : say("Opens inline")),
      i: () => box()?.focus(), "/": () => box()?.focus(), j: () => scroller?.scrollBy({ top: 66 }), k: () => scroller?.scrollBy({ top: -66 }),
      J: () => { if (it.files?.length > 1) { fileIndex = (fileIndex + 1) % it.files.length; rerender() } },
      K: () => { if (it.files?.length > 1) { fileIndex = (fileIndex + it.files.length - 1) % it.files.length; rerender() } },
      c: () => { if (it.files) { hideComments = !hideComments; rerender() } },
      z: () => { if (!it.files) return; const f = FILES[it.files[fileIndex]]; const open = f.folds.find(([a]) => !folded.has(`${f.tab}:${a}`) && a !== f.folds[0][0]) ?? f.folds[0]; const key = `${f.tab}:${open[0]}`; folded.has(key) ? folded.delete(key) : folded.add(key); rerender() },
      Z: () => { if (!it.files) return; const f = FILES[it.files[fileIndex]]; const all = f.folds.every(([a]) => folded.has(`${f.tab}:${a}`)); for (const [a] of f.folds) all ? folded.delete(`${f.tab}:${a}`) : folded.add(`${f.tab}:${a}`); rerender() },
      O: () => { if (it.files) { outlineOpen = !outlineOpen; rerender() } },
      g: () => { scopeAll = !scopeAll; card.classList.toggle("scope-all", scopeAll) },
      u: () => { const lastId = [...answered].pop(); if (!lastId) return say("Nothing to undo"); answered.delete(lastId); done--; show(ITEMS.findIndex((x) => x.id === lastId)); say("Undone") },
      s: () => { if (it.story) sheet("story") },
      f: () => { $("app").classList.toggle("inline") },
      "?": () => sheet("keys"),
    }
    if (/^[1-4]$/.test(k) && it.options) { e.preventDefault(); return act(k) }
    const h = handlers[k]
    if (h) { e.preventDefault(); h() }
  })
  document.addEventListener("click", (e) => {
    const el = e.target instanceof Element ? e.target : null
    if (!el) return
    if (el === $("sheet")) { $("sheet").hidden = true; return }
    const go = el.closest("[data-go]"); if (go) { $("sheet").hidden = true; return show(ITEMS.findIndex((x) => x.id === go.dataset.go)) }
    const pre = el.closest("[data-preset]"); if (pre) return preset(pre.dataset.preset)
    const key = el.closest("[data-key]"); if (key && card.contains(key)) return act(key.dataset.key)
    const tab = el.closest("[data-file]"); if (tab) { fileIndex = Number(tab.dataset.file); return rerender() }
    const fold = el.closest("[data-fold]"); if (fold && fold.dataset.fold) { const f = FILES[current().files[fileIndex]]; const k2 = `${f.tab}:${fold.dataset.fold}`; folded.has(k2) ? folded.delete(k2) : folded.add(k2); return rerender() }
    const jump = el.closest("[data-jump], [data-line]"); if (jump) { const n = jump.dataset.jump ?? jump.dataset.line; card.querySelector(`.ln[data-n="${n}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" }); return }
    const seg = el.closest("[data-t]"); if (seg && current().kind === "recording") return seek(Number(seg.dataset.t))
    if (el.closest("#pp")) return toggle()
    const no = el.closest(".no"); if (no) { const b = box(); b.value += `${b.value && !b.value.endsWith("\n") ? "\n" : ""}L${no.textContent}: `; b.focus() }
  })

  // ------------------------------------------------------------------------------------------------
  // Start at the hash: #approval, #approval-later, #storyline, #failed, #code, #decision, #recording, #design, #notification.
  const hash = decodeURIComponent(location.hash.slice(1))
  const [want, later] = hash.split("-")
  const start = Math.max(0, ITEMS.findIndex((x) => x.id === want))
  show(start, false)
  if (params.get("inline")) $("app").classList.add("inline")
  if (later === "later") card.classList.add("choosing")
  if (params.get("t") && current().kind === "recording") seek(Number(params.get("t")))
  if (params.get("outline") && current().files) { outlineOpen = true; rerender() }
  if (params.get("fold") && current().files) { folded.add(`${FILES[current().files[0]].tab}:${FILES[current().files[0]].folds[2]?.[0] ?? FILES[current().files[0]].folds[0][0]}`); rerender() }
})()
</script>
</body>
</html>
