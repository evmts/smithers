# Every terminal is one tmux session per person (decision 0013 §3): the latest client's size wins, 50,000 lines of
# history, mouse scrolling, and no status line inside the app's frame.
set -g window-size latest
set -g history-limit 50000
set -g mouse on
set -g status off
set -g default-terminal "xterm-256color"
set -g default-shell /bin/bash
set -s escape-time 10
